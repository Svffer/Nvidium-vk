plugins {
    id 'net.neoforged.moddev' version '2.0.148'
    id 'maven-publish'
    // Quality gates (see AGENTS.md, hk.pkl, mise.toml): formatter and compile-time bug patterns.
    id 'com.diffplug.spotless' version '8.11.0'
}

def gitCommitHash = { ->
    try {
        ExecOutput result = providers.exec {
            commandLine = ['git', 'rev-parse', '--short', 'HEAD']
            ignoreExitValue = true
        }

        if (result.getResult().get().getExitValue() != 0) {
            return "<UnknownCommit>";
        } else {
            return result.standardOutput.asText.get().strip();
        }
    } catch (Exception e) {
        e.printStackTrace()
        return "<UnknownCommit>";
    }
}
def buildtime = System.currentTimeSeconds()

version = project.mod_version
group = project.maven_group

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

base {
    archivesName = "nvidium-neoforge"
}

neoForge {
    version = project.neo_version

    // Access transformer is picked up from the default location
    // src/main/resources/META-INF/accesstransformer.cfg

    runs {
        client {
            client()
            jvmArguments.addAll("-Xmx8G")

            // Benchmark harness (docs/VULKAN_PLAN.md, M0):
            //   ./gradlew runClient -PbenchLabel="gl+nvidium" [-PbenchWorld="New World"]
            //            [-PnvidiumDisable=true] [-PbenchWarmup=45] [-PbenchDuration=60]
            if (project.hasProperty('benchLabel')) {
                systemProperties.put('nvidium.bench', 'true')
                systemProperties.put('nvidium.bench.label', project.property('benchLabel').toString())
                if (project.hasProperty('benchWarmup')) systemProperties.put('nvidium.bench.warmup', project.property('benchWarmup').toString())
                if (project.hasProperty('benchDuration')) systemProperties.put('nvidium.bench.duration', project.property('benchDuration').toString())
                if (project.hasProperty('benchPos')) systemProperties.put('nvidium.bench.pos', project.property('benchPos').toString())
                programArguments.addAll('--quickPlaySingleplayer', project.findProperty('benchWorld')?.toString() ?: 'New World')
                programArguments.addAll('--width', '1600', '--height', '900')
            }
            if (project.hasProperty('nvidiumDisable')) {
                systemProperties.put('nvidium.forceDisable', 'true')
            }
        }
    }

    mods {
        nvidium {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    def version = project.version

    inputs.properties("version": version, "commit": gitCommitHash, "buildtime": buildtime)

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "commit": gitCommitHash, "version": version, "buildtime": buildtime
    }
}

repositories {
    mavenCentral() // palantir-java-format
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "CaffeineMC"
        url = "https://maven.caffeinemc.net/releases"
    }
}

// The published sodium-neoforge artifact is a LIBRARY-type wrapper jar
// (platform/compatibility classes) that carries the actual mod in
// META-INF/jarjar/*.jar. The nested jar is extracted purely for compilation;
// at runtime the whole wrapper goes on the classpath and FML unpacks JarJar.
configurations {
    sodiumWrapper {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

tasks.register('extractSodium', Copy) {
    def wrapper = configurations.sodiumWrapper
    from({ zipTree(wrapper.singleFile) }) {
        include 'META-INF/jarjar/*.jar'
        eachFile { it.path = it.name }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('sodium')
}

dependencies {
    sodiumWrapper "net.caffeinemc:sodium-neoforge:${project.sodium_version}"

    compileOnly fileTree(dir: layout.buildDirectory.dir('sodium'), include: '*.jar').builtBy('extractSodium')
    compileOnly files(configurations.sodiumWrapper)
    runtimeOnly "net.caffeinemc:sodium-neoforge:${project.sodium_version}"
    implementation "net.caffeinemc:sodium-neoforge-api:${project.sodium_version}"

    compileOnly "maven.modrinth:iris:${project.iris_version}"
}

// ---------------------------------------------------------------------------------------------
// Quality gates. `./gradlew spotlessCheck` is what hk.pkl runs before a commit;
// `./gradlew spotlessApply` fixes formatting. Do not loosen these to get a change through:
// a narrow exception with a reason is the only accepted way (see AGENTS.md).
spotless {
    java {
        target 'src/**/*.java'
        palantirJavaFormat('2.102.0') // 4-space, 120-column style close to the upstream code
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
