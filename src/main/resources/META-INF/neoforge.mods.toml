modLoader = "javafml"
loaderVersion = "[4,)"
license = "LGPL-3.0"
issueTrackerURL = "https://github.com/MCRcortex/nvidium/issues"

[[mods]]
modId = "nvidium"
version = "${version}"
displayName = "Nvidium"
authors = "Cortex"
credits = "drouarb"
iconFile = "assets/nvidium/nvidium.png"
description = '''
Replacement rendering engine for sodium
'''

[modproperties.nvidium]
commit = "${commit}"
buildtime = "${buildtime}"
"sodium:config_api_user" = "me.cortex.nvidium.config.ConfigGuiBuilder"

[[mixins]]
config = "nvidium.mixins.json"

[[dependencies.nvidium]]
modId = "neoforge"
type = "required"
versionRange = "[26.2,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.nvidium]]
modId = "minecraft"
type = "required"
versionRange = "[26.2]"
ordering = "NONE"
side = "CLIENT"

[[dependencies.nvidium]]
modId = "sodium"
type = "required"
versionRange = "[0.9.1,0.9.3)"
ordering = "AFTER"
side = "CLIENT"
